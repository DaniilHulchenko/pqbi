<dx-popup
    [hideOnOutsideClick]="false"
    [showCloseButton]="true"
    [(visible)]="modalVisible"
    [dragEnabled]="false"
    title="Base/Custom Parameter Advanced Settings"
    height="80vh"
    width="80vw"
>
    <dx-scroll-view>
        <div style="margin: 20px; display: flex; gap: 40px;">
            <div style="flex: 1; min-width: 300px;">
                <h5>Normalize Values:</h5>
                <dx-radio-group
                    [(value)]="normalizeValue"
                    [items]="normalizationOptions"
                    displayExpr="text"
                    valueExpr="value"
                ></dx-radio-group>
                <dx-number-box
                    *ngIf="normalizeValue === 'other'"
                    [(value)]="normalizeNominalValue"
                    placeholder="Normalization Value"
                    [min]="0"
                ></dx-number-box>

                <h5 style="margin-top: 24px;">Exclude Flagged:</h5>
                <dx-radio-group
                    [(value)]="excludeFlagged"
                    [items]="[
                        { value: 'none',           text: 'No selection – default' },
                        { value: 'defaultEvents',  text: 'Yes – with default events (Dip, Swell, Interrupt)' },
                        { value: 'userSelected',   text: 'Yes – with user selected flagging events' }
                    ]"
                    displayExpr="text"
                    valueExpr="value"
                ></dx-radio-group>
                <div *ngIf="excludeFlagged === 'userSelected'" style="margin-top: 12px;">
                    <dx-select-box
                        [(value)]="defaultFlagEvent"
                        [items]="flaggingEvents"
                        displayExpr="description"
                        valueExpr="eventClass"
                        placeholder="Select event"
                    ></dx-select-box>
                </div>

                <h5 style="margin-top: 24px;">Tag Value Calculation:</h5>
                <dx-radio-group
                    [(value)]="tagValueCalculation"
                    [items]="[
                        { value: 'none',   text: 'No selection - default' },
                        { value: 'ignore', text: 'Ignore aligning function' },
                        { value: 'replace', text: 'Replace the parameter’s Aggregation with <Func>' }
                    ]"
                    displayExpr="text"
                    valueExpr="value"
                ></dx-radio-group>
                <dx-select-box
                    *ngIf="tagValueCalculation === 'replace'"
                    [(value)]="customAggregationFunc"
                    [items]="aggregationFuncOptions"
                    displayExpr="text"
                    valueExpr="value"
                    placeholder="Select aggregation function"
                ></dx-select-box>                
            </div>

            <div style="flex: 1; min-width: 300px;">
                <h5>Set Lower and Upper Limits:</h5>
                <dx-radio-group
                    [(value)]="setLimits"
                    [items]="[
                        { value: 'none', text: 'No selection - default' },
                        { value: 'fixed', text: 'Yes – with fixed values' },
                        { value: 'percentNominal', text: 'Yes – % from nominal' },
                        { value: 'percentNormalization', text: 'Yes – % from Normalization Values' }
                    ]"
                    displayExpr="text"
                    valueExpr="value"
                ></dx-radio-group>
                <div *ngIf="setLimits !== 'none'" style="margin-top: 12px; display: flex; gap: 12px;">
                    <dx-number-box [(value)]="lowerLimit" placeholder="Lower Limit" [min]="0"></dx-number-box>
                    <dx-number-box [(value)]="upperLimit" placeholder="Upper Limit" [min]="0"></dx-number-box>
                </div>

                <h5 style="margin-top: 24px;">Set Color Schemes:</h5>
                <dx-radio-group
                    [(value)]="colorScheme"
                    [items]="[
                        { value: 'none', text: 'No selection - default' },
                        { value: 'outLimit', text: 'Out-of-limit color' },
                        { value: 'gradient', text: 'Two-color color scheme' }
                    ]"
                    displayExpr="text"
                    valueExpr="value"
                ></dx-radio-group>
                <div *ngIf="colorScheme === 'outLimit'" style="margin-top: 12px;">
                    <dx-color-box [(value)]="outOfLimitColor" placeholder="Out-of-limit Color"></dx-color-box>
                </div>
                <div *ngIf="colorScheme === 'gradient'" style="margin-top: 12px; display: flex; gap: 12px;">
                    <dx-color-box [(value)]="gradientFromColor" placeholder="From Color"></dx-color-box>
                    <dx-color-box [(value)]="gradientToColor" placeholder="To Color"></dx-color-box>
                </div>
                <div style="margin-top: 12px; display: flex; gap: 12px;">
                    <dx-color-box [(value)]="okColor" placeholder="OK Color"></dx-color-box>
                    <dx-color-box [(value)]="noDataColor" placeholder="No Data Color"></dx-color-box>
                </div>
            </div>
        </div>

        <div style="margin: 20px; display: flex; justify-content: center; gap: 32px;">
            <dx-button
                text="Cancel"
                (onClick)="hide()"
                stylingMode="contained"
                [width]="140"
                [height]="48"
            ></dx-button>
            <dx-button
                text="OK"
                type="success"
                (onClick)="save()"
                stylingMode="contained"
                [width]="140"
                [height]="48"
            ></dx-button>
        </div>
    </dx-scroll-view>
</dx-popup>
