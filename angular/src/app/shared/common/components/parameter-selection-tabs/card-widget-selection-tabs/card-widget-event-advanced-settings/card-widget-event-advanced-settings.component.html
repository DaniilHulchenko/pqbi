<dx-popup
  [hideOnOutsideClick]="false"
  [showCloseButton]="true"
  [(visible)]="modalVisible"
  [dragEnabled]="false"
  title="Event Parameter Advanced Settings"
  height="80vh"
  width="80vw"
>
  <dx-scroll-view>
    <div style="margin: 20px; display: flex; gap: 40px; flex-wrap: wrap">
      <div style="flex: 1; min-width: 300px;">
        <h5>Name</h5>
        <dx-text-box [(value)]="parameterName" placeholder="Parameter name"></dx-text-box>
        <h5>Normalize Values:</h5>
        <div *ngFor="let opt of normalizationOptions" class="mb-2">
          <p-checkbox
            [binary]="true"
            [label]="opt.text"
            [value]="opt.value"
            [ngModel]="normalizeValue === opt.value"
            (onChange)="onSelectNormalize(opt.value)"
          ></p-checkbox>
        </div>

        <dx-number-box
          *ngIf="normalizeValue === normalizeTypes.VALUE"
          [(value)]="normalizeNominalValue"
          placeholder="Normalization Value"
          [min]="0"
          class="mt-2"
        ></dx-number-box>

        <h5 class="mt-4">Exclude Flagged:</h5>
        <div *ngFor="let opt of excludeFlaggedOptions" class="mb-2">
          <p-checkbox
            [binary]="true"
            [label]="opt.text"
            [ngModel]="excludeFlagged === opt.value"
            (onChange)="onSelectExcludeFlagged(opt.value)"
          ></p-checkbox>
        </div>

        <div *ngIf="excludeFlagged === excludeFlaggedTypes.UserSelected" class="mt-3">
          <p-multiSelect
            [options]="flaggingEvents"
            [(ngModel)]="selectedFlagEvents"
            optionLabel="description"
            optionValue="eventClass"
            placeholder="Select events"
            display="chip"
            [showClear]="true"
            [filter]="true"
            styleClass="w-100"
          ></p-multiSelect>
        </div>

        <h6 class="mt-3">Decimal points:</h6>
        <dx-select-box class="w-25" [(value)]="decimalPoints" [items]="decimalPointOptions"
          placeholder="Select decimal points"></dx-select-box>
      </div>

      <!-- right block -->
      <div style="flex: 1; min-width: 300px;">
        <h5>Fonts</h5>
        <div class="font-section">
          <div class="font-row">
            <label>Title</label>
            <dx-select-box [items]="fontFamilies" [(value)]="titleFont.family" placeholder="font family">
            </dx-select-box>

            <dx-number-box [(value)]="titleFont.size" placeholder="font size" [min]="8" [max]="50">
            </dx-number-box>

            <div class="font-color">
              <label>font color</label>
                  <dx-color-box [(value)]="titleFont.customColor" [editAlphaChannel]="true"></dx-color-box>
            </div>
          </div>

          <div class="font-row">
            <label>Value</label>
            <dx-select-box [items]="fontFamilies" [(value)]="valueFont.family" placeholder="font family">
            </dx-select-box>

            <dx-number-box [(value)]="valueFont.size" placeholder="font size" [min]="8" [max]="50">
            </dx-number-box>

            <div class="font-color">
              <label>font color</label>
                  <dx-color-box [(value)]="valueFont.customColor" [editAlphaChannel]="true"></dx-color-box>
            </div>
          </div>
        </div>

        <!-- Icon Section -->
        <h5>Icon</h5>
        <div class="icon-section d-flex flex-column gap-2">
          <div class="d-flex flex-column">
            <label>Upload new icon</label>
            <dx-file-uploader selectButtonText="select file" [multiple]="false" [allowedFileExtensions]="['.svg']" (onValueChanged)="onFileChanged($event)">
            </dx-file-uploader>
          </div>

          <div class="d-flex flex-column gap-2" *ngIf="hasSelectedIcon">
            <div class="d-flex align-items-center gap-3">
              <img *ngIf="selectedIconPreview || icon.file" [src]="selectedIconPreview || icon.file" style="width: 32px; height: 32px;" />
              <span>{{ icon.name || 'Selected icon' }}</span>
            </div>

            <div class="d-flex align-items-center gap-3">
              <p-checkbox
                [binary]="true"
                [disabled]="!hasSelectedIcon || !icon.id"
                [(ngModel)]="setAsDefaultIcon"
                label="Set as default icon"
              ></p-checkbox>
              <button dx-button type="default" text="Reset to default icon" [disabled]="!hasSelectedIcon" (onClick)="resetIcon()"></button>
            </div>
          </div>

          <div class="d-flex flex-column">
            <label>Choose existing icon</label>
            <dx-select-box
              [items]="availableIcons"
              displayExpr="name"
              valueExpr="id"
              [value]="icon.id"
              placeholder="Select icon"
              (onValueChanged)="onIconSelected($event.value)"
              itemTemplate="iconItem"
            >
              <div *dxTemplate="let item of 'iconItem'" class="d-flex align-items-center gap-2">
                <img *ngIf="item?.content" [src]="item.content" style="width: 24px; height: 24px;" />
                <span>{{item?.name}}</span>
              </div>
            </dx-select-box>
          </div>

          <div>
            <label>appearance</label>
            <dx-radio-group [items]="appearanceOptions" displayExpr="text" valueExpr="id" [(value)]="icon.appearance">
            </dx-radio-group>
          </div>

          <div>
            <label>color</label>
            <dx-color-box class="w-25" [(value)]="icon.customColor" [editAlphaChannel]="true"></dx-color-box>
          </div>
        </div>

        <!-- Link Section -->
        <h5>Link</h5>
        <div class="link-section">
          <label>select PQBI page</label>
          <dx-select-box
            [items]="pqbiPages"
            displayExpr="name"
            valueExpr="id"
            [(value)]="link.page"
            placeholder="Select PQBI page"
          >
         </dx-select-box>
        </div>
      </div>
    </div>

    <!-- buttons -->
    <div class="d-flex justify-content-center mt-4 mb-3 gap-4">
      <dx-button
        text="Cancel"
        (onClick)="hide()"
        stylingMode="contained"
        [width]="140"
        [height]="48"
      ></dx-button>
      <dx-button
        text="OK"
        type="success"
        (onClick)="save()"
        stylingMode="contained"
        [width]="140"
        [height]="48"
      ></dx-button>
    </div>
  </dx-scroll-view>
</dx-popup>
