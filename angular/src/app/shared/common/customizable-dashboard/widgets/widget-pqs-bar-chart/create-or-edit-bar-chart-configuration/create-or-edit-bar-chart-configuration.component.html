<dx-popup [hideOnOutsideClick]="false" (onHidden)="hide(false)" [showCloseButton]="true" [(visible)]="modalVisible" [dragAndResizeArea]="false"
    [dragEnabled]="false" title="Edit Bar Chart Widget Configuration" height="90vh" width="90vw">

    <form class="d-flex flex-column h-100" #barChartWidgetConfigurationForm="ngForm" novalidate autocomplete="off">

        <div class="d-flex align-items-end mb-3" style="gap: 1rem;">
            
        </div>

        <div class="d-flex mb-3" style="gap: 1rem; align-items: flex-start;">
            <div>
                    <datetimeRangeSelector
                        name="dateRange"
                        [(ngModel)]="dateRangeSelectionState"
                        required
                        style="flex: 1; max-width: 200px;"
                    />
                <div style="border: 1px solid #ccc; padding: 1rem; display: flex; gap: 1rem;">
                    <div>
                        Select X-unit
                        <p-listbox name="xUnit" [(ngModel)]="selectedXUnit" [options]="xUnitOptions" optionLabel="label" optionValue="value"
                            style="width: 150px; height: 200px;" (onChange)="onXUnitChange($event.value)"></p-listbox>
                    </div>
                    <div>
                        Select series
                        <p-listbox name="series" [(ngModel)]="selectedSeries" [options]="seriesOptions" optionLabel="label"
                            optionValue="value" style="width: 150px; height: 200px;" (onChange)="onSeriesChange($event.value)"></p-listbox>
                    </div>
                </div>
            </div>
            <div class="d-flex flex-column align-items-center" style="gap: 0.25rem;">

                {{ 'XUnits' | localize }}
                <div style="border:1px solid #ccc; padding:0.5rem; width:150px; text-align:center;">
                    {{ xUnitLabel }}
                </div>

                <dx-button
                    type="button"
                    class="btn btn-outline-secondary"
                    (onClick)="swapXUnitSeries()"
                    title="{{ 'SwapAxes' | localize }}"
                >
                <i class="pi pi-arrows-v"></i>
                </dx-button>

                {{ 'Series' | localize }}
                <div style="border:1px solid #ccc; padding:0.5rem; width:150px; text-align:center;">
                    {{ seriesLabel }}
                </div>

                <label style="padding: 0.5rem;">
                    {{ 'ChartType' | localize }}
                </label>

                <p-listbox
                    name="chartType"
                    [ngModel]="barChartWidgetConfiguration.type"
                    (ngModelChange)="onChartTypeChange($event)"
                    [options]="chartTypeOptions"
                    optionLabel="label"
                    optionValue="value"
                    [filter]="false"
                    style="width:150px; height:auto;"
                    required
                ></p-listbox>

            </div>
            <div style="flex: 1; border: 1px solid #eee; padding: 1rem;"
                class="container flex-grow-1">
                <bar-chart-preview [type]="barChartWidgetConfiguration.type" [data]="previewData"></bar-chart-preview>            
            </div>
            </div>

        <div class="d-flex mb-3" style="gap: 20px;">
            <div 
                style="min-width: 400px; max-width: 400px;"
                class="container">
                <componentsSelector
                    id="componentsState"
                    name="componentsState"
                    [height]="'420px'"
                    [(ngModel)]="componentsState"
                    (ngModelChange)="onComponentsStateChange()"
                    [isFeederSelectionEnabled]="true"
                    required
                />
            </div>

            <div class="flex-grow-1 h-500px">
                <dx-tab-panel
                    #tabPanel
                    [dataSource]="tabs"
                    [loop]="false"
                    [animationEnabled]="true"
                    [swipeEnabled]="true"
                    [deferRendering]="false"
                    class="table-custom-styles"
                >
                    <div class="h-450px" *dxTemplate="let option of 'customTemplate'">
                        <customParameterSelectionTab
                            #customParameterSelectionTab
                            [disableComponentSelection]="true"
                            [isInsideTable]="true"
                            [chartType]="'barchart'"
                            [customParameterTypes]="['SPMC','MPSC']"
                            (onAdd)="onAddCustomParameter($event)"
                            (onEditSave)="onEditCustomParameter($event)"
                        />
                    </div>
                    <div class="h-450px" *dxTemplate="let option of 'logicalTemplate'">
                        <logicalParameterSelectionTab
                            #logicalParameterSelectionTab
                            [disableComponentSelection]="true"
                            [isInsideTable]="true"
                            [chartType]="'barchart'"
                            [outerComponentsState]="componentsState"
                            (onAdd)="onAddBaseParameter($event)"
                            (onEditSave)="onEditBaseParameter($event)"
                        />
                    </div>
                    <div class="h-450px" *dxTemplate="let option of 'channelTemplate'">
                        <channelParameterSelectionTab
                            #channelParameterSelectionTab
                            [disableComponentSelection]="true"
                            [isInsideTable]="true"
                            [chartType]="'barchart'"
                            [outerComponentsState]="componentsState"
                            (onAdd)="onAddBaseParameter($event)"
                            (onEditSave)="onEditBaseParameter($event)"
                        />
                    </div>
                    <div class="h-450px" *dxTemplate="let option of 'additionalTemplate'">
                        <additional-parameter-selection-tab
                            #additionalParameterSelectionTab
                            [disableComponentSelection]="true"
                            [isInsideTable]="true"
                            [chartType]="'barchart'"
                            [outerComponentsState]="componentsState"
                            (onAdd)="onAddBaseParameter($event)"
                            (onEditSave)="onEditBaseParameter($event)"
                        />
                    </div>
                    <div class="h-450px" *dxTemplate="let option of 'eventTemplate'">
                        <eventParameterSelectionTab
                            #eventParameterSelectionTab
                            [isInsideTable]="true"
                            [chartType]="'barchart'"
                            (onAdd)="onAddEvent($event)"
                            (onEditSave)="onEditEvent($event)"
                        />
                    </div>
                <div *dxTemplate="let option of 'title'">
                    <i class="fa" [ngClass]="getIconClass(option.ID)"></i>
                    <span>{{option.name}}</span>
                </div>
                </dx-tab-panel>
            </div>
        </div>

        <div class="mt-3">
            <dx-scroll-view #scrollView direction="vertical" style="height:100%;">
                <dx-data-grid
                    #grid
                    name="components"
                    [dataSource]="parameters"
                    (onEditingStart)="updateParameter($event)"
                    (onRowRemoved)="onRowRemoved()"
                    [showBorders]="true"
                    style="height: 100%;"
                >
                    <dxi-column caption="Name" dataField="name"></dxi-column>
                    <dxi-column caption="Type" dataField="type"></dxi-column>
                    <dxi-column caption="Quantity" dataField="quantity"></dxi-column>
                    <dxo-editing [useIcons]="true" [allowUpdating]="true" [allowDeleting]="true">
                    </dxo-editing>
                    <dxi-column type="buttons">
                        <dxi-button name="edit"></dxi-button>
                        <dxi-button hint="Duplicate" icon="copy" [onClick]="duplicateParameterCommand">
                        </dxi-button>
                        <dxi-button name="delete"></dxi-button>
                    </dxi-column>
                </dx-data-grid>
            </dx-scroll-view>
        </div>
    

<dxi-popup-toolbar-item widget="dxButton" toolbar="bottom" location="after">
            <button type="button" class="btn btn-light-primary fw-bold" (click)="hide(false)" [disabled]="saving">
                {{ 'Cancel' | localize }}
            </button>
            <button type="submit" class="btn btn-primary fw-bold" [disabled]="saving || !isFormValid()" (click)="save()">
                <i class="fa fa-save"></i>
                <span>{{ 'Save' | localize }}</span>
            </button>
        </dxi-popup-toolbar-item>
    </form>
</dx-popup>
