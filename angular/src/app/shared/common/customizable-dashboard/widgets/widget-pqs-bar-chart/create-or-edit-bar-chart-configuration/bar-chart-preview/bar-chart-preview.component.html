<div [ngSwitch]="type">
    <div *ngSwitchCase="barChartType.Plain">
        <dx-chart id="chart" [dataSource]="plainData">
            <dxi-series argumentField="category" valueField="value" type="bar"></dxi-series>
            <dxo-export [enabled]="true"></dxo-export>
            <dxo-tooltip [enabled]="true" [customizeTooltip]="customizeTooltip"></dxo-tooltip>
        </dx-chart>
    </div>
    <div *ngSwitchCase="barChartType.Stacked">
        <dx-chart id="chart" title="Component(s) Event(s) Count Stacked Bar" [dataSource]="multiSeriesData">            <dxo-common-series-settings
                argumentField="category"
                valueField="value"
                type="stackedBar"
                hoverMode="allArgumentPoints"
                selectionMode="allArgumentPoints"
            >
                <dxo-label [visible]="true" [format]="fixedPoint2"></dxo-label>
            </dxo-common-series-settings>
            <dxo-series-template nameField="seriesName"></dxo-series-template>
            <dxo-legend verticalAlignment="bottom" horizontalAlignment="center"></dxo-legend>
            <dxo-export [enabled]="true"></dxo-export>
            <dxo-tooltip [enabled]="true" location="edge" [customizeTooltip]="customizeTooltip"></dxo-tooltip>
        </dx-chart>
    </div>
    <div *ngSwitchCase="barChartType.Clustered">
        <dx-chart id="chart" title="Component(s) Event(s) Count Clustered Bar" [dataSource]="multiSeriesData">
            <dxo-common-series-settings argumentField="category" valueField="value" type="bar">
                <dxo-label [visible]="true" [format]="fixedPoint2"></dxo-label>
            </dxo-common-series-settings>
            <dxo-series-template nameField="seriesName"></dxo-series-template>
            <dxo-legend verticalAlignment="bottom" horizontalAlignment="center" itemTextPosition="top"></dxo-legend>
            <dxo-export [enabled]="true"></dxo-export>
            <dxo-tooltip [enabled]="true" location="edge" [customizeTooltip]="customizeTooltip"></dxo-tooltip>        </dx-chart>
    </div>
</div>
