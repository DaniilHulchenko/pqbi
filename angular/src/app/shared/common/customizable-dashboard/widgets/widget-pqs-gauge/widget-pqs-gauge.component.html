<div
    class="kt-portlet kt-portlet--height-fluid widget-full-height"
    [ngStyle]="{ 'background-color': widgetBackgroundColor }"
    (click)="onWidgetClick($event)"
    [class.widget-link-enabled]="canNavigateToPage && !editState"
    [attr.role]="canNavigateToPage && !editState ? 'button' : null"
    [attr.tabindex]="canNavigateToPage && !editState ? '0' : null"
>
    <div class="kt-portlet__head"
         [ngStyle]="{ 'background-color': headerBackgroundColor, color: headerTitleColor }"
         (click)="onTitleClick($event, headerColorPicker)">
        <div class="kt-portlet__head-label">
            <h3 class="kt-portlet__head-title" [ngStyle]="{ 'font-size': widgetNameFontSize, color: headerTitleColor }">
                <span [ngStyle]="{ 'background-color': editState ? headerTitleBadgeColor : 'transparent', color: headerTitleColor }">
                    {{ widgetConfigurationInDB?.name }}
                </span>
                <input
                    #headerColorPicker
                    class="color-input-hidden"
                    type="color"
                    [value]="headerBackgroundColor"
                    (input)="onHeaderColorChange($event)" />
            </h3>
        </div>
    </div>
    <div class="kt-portlet__body gauge-body-flex" id="outerScroll" [ngStyle]="{ 'background-color': widgetBackgroundColor }">
        <div class="gauge-color-controls d-flex align-items-center flex-wrap mb-2">
            <div class="d-flex align-items-center">
                <button type="button" class="color-swatch" [style.backgroundColor]="widgetBackgroundColor" (click)="openColorPicker(bgColorPicker)"></button>
                <input
                    #bgColorPicker
                    class="color-input-hidden"
                    type="color"
                    [value]="widgetBackgroundColor"
                    (input)="onBackgroundColorChange($event)" />
            </div>
        </div>
       <div [ngSwitch]="style?.style" class="w-100 h-75">
            <!--Circle widget-->
            <div *ngSwitchCase="1" class="gauge-chart-container flex-grow-1">
                <dx-circular-gauge class="w-100 h-100" [value]="displayValue" [rangeContainer]="{ranges: ranges}"
                    [subvalues]="subvalues">
                    <dxo-title [text]="title"
                        [font]="{ size: titleFontSize, color: titleFontColor, family: titleFontFamily }">
                        <dxo-font [size]="titleFontSize" [color]="titleFontColor" [family]="titleFontFamily"></dxo-font>
                        <dxo-subtitle [text]="formattedValueWithUnit"
                            [font]="{ size: valueFontSize, color: valueFontColor, family: valueFontFamily }"></dxo-subtitle>
                    </dxo-title>
                    <dxo-geometry [startAngle]="style.startAngle" [endAngle]="style.endAngle"></dxo-geometry>
                    <dxo-range-container [width]="style.arcWidth"></dxo-range-container>
                    <dxo-scale [startValue]="lowerLimit" [endValue]="upperLimit" [customTicks]="scaleCustomTicks">
                        <dxo-label [indentFromTick]="style.arcWidth" [customizeText]="scaleLabelCustomizeText"></dxo-label>
                    </dxo-scale>
                    <dxo-tooltip [enabled]="true" [customizeTooltip]="customizeTooltip"></dxo-tooltip>
                    <dxo-animation [enabled]="false"></dxo-animation>
                </dx-circular-gauge>
            </div>

            <!--Line widget-->
            <div *ngSwitchCase="2" class="gauge-chart-container flex-grow-1">
                <dx-linear-gauge class="w-100 h-100" [value]="displayValue" [rangeContainer]="{ranges: ranges}"
                    [subvalues]="subvalues">
                    <dxo-title [text]="title"
                        [font]="{ size: titleFontSize, color: titleFontColor, family: titleFontFamily }">
                        <dxo-font [size]="titleFontSize" [color]="titleFontColor" [family]="titleFontFamily"></dxo-font>
                        <dxo-subtitle [text]="formattedValueWithUnit"
                            [font]="{ size: valueFontSize, color: valueFontColor, family: valueFontFamily }"></dxo-subtitle>
                    </dxo-title>
                    <dxo-geometry [orientation]="orientation"></dxo-geometry>
                    <dxo-range-container [width]="style.trackWidth"></dxo-range-container>
                                    <dxo-scale [startValue]="lowerLimit" [endValue]="upperLimit" [customTicks]="scaleCustomTicks">
                    <dxo-label [customizeText]="scaleLabelCustomizeText"></dxo-label>
                    </dxo-scale>
                    <dxo-tooltip [enabled]="true" [customizeTooltip]="customizeTooltip"></dxo-tooltip>
                    <dxo-animation [enabled]="false"></dxo-animation>
                </dx-linear-gauge>
            </div>
        </div>
    </div>
</div>

<ng-container *ngIf="isEditModalInitialized">
    <createOrEditGaugeConfiguration #createOrEditModal (onSave)="onConfigurationChange($event)"
        (onClose)="onEditModelClose($event)">
    </createOrEditGaugeConfiguration>
</ng-container>

<ng-container *ngIf="editState">
    <rename-widget-modal #renameWidgetModal (onSave)="saveName($event)"></rename-widget-modal>
</ng-container>
