<div class="kt-portlet kt-portlet--height-fluid widget-full-height" [ngStyle]="{ 'background-color': widgetBackgroundColor }">
    <div class="kt-portlet__head"
         [ngStyle]="{ 'background-color': headerBackgroundColor, color: headerTitleColor }"
         (click)="onTitleClick($event, headerColorPicker)">
        <div class="kt-portlet__head-label">
            <h3 class="kt-portlet__head-title" [ngStyle]="{ 'font-size': widgetNameFontSize, color: headerTitleColor }">
                <span [ngStyle]="{ 'background-color': editState ? headerTitleBadgeColor : 'transparent', color: headerTitleColor }">
                    {{ widgetConfigurationInDB?.name }}
                </span>
                <input
                    #headerColorPicker
                    class="color-input-hidden"
                    type="color"
                    [value]="headerBackgroundColor"
                    (input)="onHeaderColorChange($event)" />
            </h3>
        </div>
    </div>
    <div class="kt-portlet__body table-body-flex" id="outerScroll" [ngStyle]="{ 'background-color': widgetBackgroundColor }">
        <div *ngIf="editState" class="table-color-controls d-flex align-items-center flex-wrap mb-2">
            <div class="d-flex align-items-center">
                <button type="button" class="color-swatch" [style.backgroundColor]="widgetBackgroundColor" (click)="openColorPicker(bgColorPicker)"></button>
                <input
                    #bgColorPicker
                    class="color-input-hidden"
                    type="color"
                    [value]="widgetBackgroundColor"
                    (input)="onBackgroundColorChange($event)" />
            </div>
        </div>
        <div class="d-flex mb-2" style="gap: 12px">
            <div *ngIf="hasEventParameter()" class="row mb-2">
                <span style="margin: 0 12px;">{{'FilterEventBy' | localize}}</span>
                <div class="col">
                    <dx-radio-group
                        [items]="[{ text: 'Value', value: 'value' }, { text: 'Duration', value: 'duration' }]"
                        [(value)]="eventDisplayMode"
                        layout="horizontal">
                    </dx-radio-group>
                </div>
            </div>

            <div class="d-flex align-items-center mb-2" style="gap:8px;">
                <span style="white-space: nowrap;">{{'SortBy' | localize}}</span>
                <dx-radio-group [value]="sortMode" [items]="[
                                    { value: 'value', text: 'Value' },
                                    { value: 'color', text: 'Color' }]" displayExpr="text" valueExpr="value" layout="horizontal"
                    (onValueChanged)="onSortModeChange($event.value)" style="min-width: 0;">
                </dx-radio-group>
            </div>
        </div>
        <div id="innerScroll" #treeContainer class="table-container flex-grow-1 notDraggable">
            <div *ngIf="isLoading" class="loading-overlay">
                <dx-load-indicator></dx-load-indicator>
                <p>{{'LoadingData' | localize }}</p>
            </div>
            <dx-tree-list
                #treeListComponent
                class="pqs-table"
                *ngIf="dataSource && columns"
                [dataSource]="dataSource"
                [columns]="columns"
                [filterRow]="{ visible: true }"
                [height]="'100%'"
                keyExpr="id"
                parentIdExpr="parentId"
                [autoExpandAll]="true"
                [showRowLines]="true"
                [showColumnLines]="true"
                [columnAutoWidth]="true"
                [allowColumnResizing]="editState"
                [columnResizingMode]="'nextColumn'"
                [columnMinWidth]="50"
                [wordWrapEnabled]="true"
                [showBorders]="true"
                [rowAlternationEnabled]="tableWidgetConfiguration.designOptions?.bandedRows"
                (onContentReady)="onContentReady()">
            </dx-tree-list>
        </div>
    </div>
</div>

<ng-container *ngIf="isEditModalInitialized">
    <createOrEditTableConfiguration
        #createOrEditModal
        (onSave)="onConfigurationChange($event)"
        (onClose)="onEditModelClose($event)"
    ></createOrEditTableConfiguration>
</ng-container>

<ng-container *ngIf="editState">
    <rename-widget-modal #renameWidgetModal (onSave)="saveName($event)"></rename-widget-modal>
</ng-container>
