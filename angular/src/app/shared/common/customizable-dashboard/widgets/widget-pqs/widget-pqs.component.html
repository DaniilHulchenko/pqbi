<div class="kt-portlet kt-portlet--height-fluid widget-full-height">
    <div class="kt-portlet__head widget-header-colored" [ngStyle]="{'background-color': headerBackgroundColor || null}" [class.header-clickable]="editState" (click)="onHeaderClick()">
        <div class="kt-portlet__head-label">
            <h3 class="kt-portlet__head-title" [ngStyle]="{ 'font-size': widgetNameFontSize }">
                {{ widgetConfigurationInDB?.name }}
            </h3>
        </div>
    </div>

    <div class="row align-items-center widget-settings-row" [ngStyle]="{'background-color': settingsBackgroundColor}">
        <div *ngIf="editState" class="col-auto d-flex align-items-center widget-setting">
            <input type="checkbox" id="stepLineToggle" [(ngModel)]="isStepLine" (change)="toggleStepLine()" />
            <label for="stepLineToggle" class="widget-setting-label" [ngStyle]="{ color: lineTextColor }">{{ 'StepLine' | localize }}</label>
        </div>
    
        <div class="col-auto d-flex align-items-center widget-setting">
            <input type="checkbox" id="linePointsToggle" [(ngModel)]="isLinePoints" (change)="toggleLinePoints()" />
            <label for="linePointsToggle" class="widget-setting-label" [ngStyle]="{ color: lineTextColor }">{{ 'LinePoints' | localize }}</label>
        </div>

        <div class="col-auto d-flex align-items-center widget-setting">
            <label class="widget-setting-label d-flex align-items-center" [ngStyle]="{ color: lineTextColor }">
                {{ 'Line' | localize }}:
                <input type="color" class="inline-color-picker" [ngModel]="lineColor || lineTextColor" (ngModelChange)="onLineColorChange($event)" />
            </label>
        </div>

        <div class="col-auto d-flex align-items-center widget-setting">
            <label class="widget-setting-label d-flex align-items-center" [ngStyle]="{ color: lineTextColor }">
                {{ 'BG' | localize }}:
                <input type="color" class="inline-color-picker" [ngModel]="backgroundColor || chartBackgroundColor || fallbackBackgroundColor" (ngModelChange)="onBackgroundColorChange($event)" />
            </label>
        </div>
    </div>

    <div class="chart-wrapper position-relative flex-grow-1">

        <div *ngIf="lineChart.loading && lineChart.isInitialLoad" class="loading-overlay">
            <dx-load-indicator></dx-load-indicator>
            <p>{{ 'LoadingWidget' | localize }}</p>
        </div>


        <div *ngIf="errorMessage; else chartContent"
            class="chart-container d-flex align-items-center justify-content-center">
            <div class="text-center">
                <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 2rem"></i>
                <h4 class="mt-2">{{ 'Warning!' | localize }}</h4>
                <p>{{ errorMessage | localize }}</p>
            </div>
        </div>

        <ng-template #chartContent>
            <div #chartContainer class="chart-container flex-grow-1" [ngStyle]="{ 'background-color': chartBackgroundColor || null }">
                <dx-chart #chartComponent class="w-100 h-100" id="chart" [dataSource]="lineChart.chartData" (onDrawn)="onChartDrawn()">
                    <dxi-pane name="top"></dxi-pane>

                    <dxo-common-series-settings [type]="isStepLine ? 'stepline' : 'line'" argumentField="key" [color]="chartLineColor || undefined">
                        <dxo-stepline *ngIf="isStepLine">
                            <dxo-point [visible]="isLinePoints"></dxo-point>
                        </dxo-stepline>
                    </dxo-common-series-settings>

                    <dxi-series pane="top" *ngFor="let source of lineChart.chartConfiguration.lineLegend"
                        [name]="source.name" [valueField]="source.id">
                        <dxo-point [visible]="isLinePoints"></dxo-point>
                    </dxi-series>

                    <dxo-legend verticalAlignment="bottom" horizontalAlignment="center"
                        itemTextPosition="bottom"></dxo-legend>

                    <dxo-tooltip [enabled]="true" [customizeTooltip]="lineChart.customizeTooltip"></dxo-tooltip>
                </dx-chart>
            </div>
        </ng-template>
    </div>


    <ng-container *ngIf="isEditModalInitialized">
        <createOrEditTrendConfiguration #createOrEditModal (onSave)="save($event)" (onClose)="onEditModelClose($event)">
        </createOrEditTrendConfiguration>
    </ng-container>

    <ng-container *ngIf="editState">
        <rename-widget-modal #renameWidgetModal (onSave)="saveName($event)"></rename-widget-modal>
    </ng-container>

    <input #headerColorPicker class="color-picker-input" type="color" [value]="headerBackgroundColor || '#ffffff'" (input)="onHeaderColorChange($event.target.value)" />
</div>
