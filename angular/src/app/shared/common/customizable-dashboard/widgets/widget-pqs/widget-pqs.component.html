<div class="kt-portlet kt-portlet--height-fluid widget-full-height">
    <div class="kt-portlet__head widget-header-colored" [ngStyle]="{'background-color': headerBackgroundColor || null}" [class.header-clickable]="editState" (click)="onHeaderClick()">
        <div class="kt-portlet__head-label">
            <h3 class="kt-portlet__head-title" [ngStyle]="{ 'font-size': widgetNameFontSize }">
                {{ widgetConfigurationInDB?.name }}
            </h3>
        </div>
    </div>

    <div class="row align-items-center">
        <div *ngIf="editState" class="col-auto d-flex align-items-center">
            <input type="checkbox" id="stepLineToggle" [(ngModel)]="isStepLine" (change)="toggleStepLine()" />
            <label for="stepLineToggle" class="ms-2" [ngStyle]="{'color': lineLabelColor}">{{ 'StepLine' | localize }}</label>
        </div>
    
        <div class="col-auto d-flex align-items-center">
            <input type="checkbox" id="linePointsToggle" [(ngModel)]="isLinePoints" (change)="toggleLinePoints()" />
            <label for="linePointsToggle" class="ms-2" [ngStyle]="{'color': lineLabelColor}">{{ 'LinePoints' | localize }}</label>
        </div>

        <div class="col-auto d-flex align-items-center">
            <input type="checkbox" id="lineColorToggle" [checked]="isLineColorEnabled" (change)="onLineColorToggle($event.target.checked)" />
            <label for="lineColorToggle" class="ms-2 me-2" [ngStyle]="{'color': lineLabelColor}">{{ 'Line' | localize }}:</label>
            <input type="color" class="form-control form-control-color p-0" [disabled]="!isLineColorEnabled"
                [ngModel]="lineColor || detectedLineColor || defaultLinePickerColor" (ngModelChange)="onLineColorChange($event)" />
        </div>

        <div class="col-auto d-flex align-items-center">
            <input type="checkbox" id="bgColorToggle" [checked]="isBackgroundColorEnabled" (change)="onBackgroundColorToggle($event.target.checked)" />
            <label for="bgColorToggle" class="ms-2 me-2" [ngStyle]="{'color': lineLabelColor}">{{ 'BG' | localize }}:</label>
            <input type="color" class="form-control form-control-color p-0" [disabled]="!isBackgroundColorEnabled"
                [ngModel]="backgroundColor || defaultBackgroundColor" (ngModelChange)="onBackgroundColorChange($event)" />
        </div>
    </div>

    <div class="chart-wrapper position-relative flex-grow-1" [ngStyle]="{'background-color': isBackgroundColorEnabled ? backgroundColor : null}">

        <div *ngIf="lineChart.loading && lineChart.isInitialLoad" class="loading-overlay">
            <dx-load-indicator></dx-load-indicator>
            <p>{{ 'LoadingWidget' | localize }}</p>
        </div>


        <div *ngIf="errorMessage; else chartContent"
            class="chart-container d-flex align-items-center justify-content-center">
            <div class="text-center">
                <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 2rem"></i>
                <h4 class="mt-2">{{ 'Warning!' | localize }}</h4>
                <p>{{ errorMessage | localize }}</p>
            </div>
        </div>

        <ng-template #chartContent>
            <div #chartContainer class="chart-container flex-grow-1">
                <dx-chart #chartComponent class="w-100 h-100" id="chart" [dataSource]="lineChart.chartData" (onDone)="onChartRendered()">
                    <dxi-pane name="top"></dxi-pane>

                    <dxo-common-series-settings [type]="isStepLine ? 'stepline' : 'line'" argumentField="key" [color]="isLineColorEnabled ? lineColor : undefined">
                        <dxo-stepline *ngIf="isStepLine">
                            <dxo-point [visible]="isLinePoints" [color]="isLineColorEnabled ? lineColor : undefined"></dxo-point>
                        </dxo-stepline>
                    </dxo-common-series-settings>

                    <dxi-series pane="top" *ngFor="let source of lineChart.chartConfiguration.lineLegend"
                        [name]="source.name" [valueField]="source.id" [color]="isLineColorEnabled ? lineColor : undefined">
                        <dxo-point [visible]="isLinePoints" [color]="isLineColorEnabled ? lineColor : undefined"></dxo-point>
                    </dxi-series>

                    <dxo-common-pane-settings [backgroundColor]="isBackgroundColorEnabled ? backgroundColor : undefined"></dxo-common-pane-settings>

                    <dxo-legend verticalAlignment="bottom" horizontalAlignment="center"
                        itemTextPosition="bottom"></dxo-legend>

                    <dxo-tooltip [enabled]="true" [customizeTooltip]="lineChart.customizeTooltip"></dxo-tooltip>
                </dx-chart>
            </div>
        </ng-template>
    </div>


    <ng-container *ngIf="isEditModalInitialized">
        <createOrEditTrendConfiguration #createOrEditModal (onSave)="save($event)" (onClose)="onEditModelClose($event)">
        </createOrEditTrendConfiguration>
    </ng-container>

    <ng-container *ngIf="editState">
        <rename-widget-modal #renameWidgetModal (onSave)="saveName($event)"></rename-widget-modal>
    </ng-container>

    <input #headerColorPicker class="color-picker-input" type="color" [value]="headerBackgroundColor || '#ffffff'" (input)="onHeaderColorChange($event.target.value)" />
</div>
